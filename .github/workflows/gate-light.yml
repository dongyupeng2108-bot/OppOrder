name: gate-light

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  gate-light-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Generate Workspace Healer Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF}"
          if [ -z "$TASK_REF" ]; then
            TASK_REF="${GITHUB_REF_NAME}"
          fi
          PR_TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          echo "GITHUB_HEAD_REF=${GITHUB_HEAD_REF}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          echo "PR_TASK_ID=${PR_TASK_ID}"
          if [ -z "$PR_TASK_ID" ]; then
            echo "No task_id detected."
            exit 0
          fi
          YEAR="20${PR_TASK_ID:0:2}"
          MONTH="${PR_TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          EVIDENCE_FILE="${EVIDENCE_DIR}/workspace_healer_${PR_TASK_ID}.json"
          TMP_EVIDENCE_FILE="/tmp/workspace_healer_${PR_TASK_ID}.json"
          mkdir -p "$EVIDENCE_DIR"
          echo "TASK_ID=${PR_TASK_ID}"
          echo "EVIDENCE_FILE=${EVIDENCE_FILE}"
          echo "WORKSPACE_HEALER_TMP=${TMP_EVIDENCE_FILE}" >> "$GITHUB_ENV"
          echo "WORKSPACE_HEALER_BEFORE:"
          ls -la "$EVIDENCE_DIR" | grep workspace_healer_ || true
          pwsh -NonInteractive -ExecutionPolicy Bypass -File scripts/reset_workspace.ps1 -Mode Heal > /tmp/workspace_healer_heal.json
          pwsh -NonInteractive -ExecutionPolicy Bypass -File scripts/reset_workspace.ps1 -Mode EnforceClean > "$TMP_EVIDENCE_FILE"
          echo "WORKSPACE_HEALER_AFTER:"
          ls -la "$EVIDENCE_DIR" | grep workspace_healer_ || true

      - name: Workspace Healer Debug Snapshot
        run: |
          git status --porcelain
          git diff --name-only
          git diff --stat
          ls -la rules/task-reports/2026-02 | head
          if [ -n "$WORKSPACE_HEALER_TMP" ]; then
            cat "$WORKSPACE_HEALER_TMP" | head -n 120
          fi

      - name: Persist Workspace Healer Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF}"
          if [ -z "$TASK_REF" ]; then
            TASK_REF="${GITHUB_REF_NAME}"
          fi
          PR_TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${PR_TASK_ID:0:2}"
          MONTH="${PR_TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          echo "PR_TASK_ID=${PR_TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          echo "PR_TASK_ID=${PR_TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          EVIDENCE_FILE="${EVIDENCE_DIR}/workspace_healer_${PR_TASK_ID}.json"
          if [ -n "$WORKSPACE_HEALER_TMP" ] && [ -f "$WORKSPACE_HEALER_TMP" ]; then
            cat "$WORKSPACE_HEALER_TMP" > "$EVIDENCE_FILE"
          fi

      - name: Verify Workspace Healer Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF}"
          if [ -z "$TASK_REF" ]; then
            TASK_REF="${GITHUB_REF_NAME}"
          fi
          PR_TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${PR_TASK_ID:0:2}"
          MONTH="${PR_TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "PR_TASK_ID=${PR_TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          EVIDENCE_FILE="${EVIDENCE_DIR}/workspace_healer_${PR_TASK_ID}.json"
          ls -la "$EVIDENCE_DIR"
          if [ ! -f "$EVIDENCE_FILE" ]; then
            echo "Missing workspace healer evidence: $EVIDENCE_FILE"
            exit 1
          fi

      - name: Generate CI Parity Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${TASK_ID:0:2}"
          MONTH="${TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          node scripts/ci_parity_probe.mjs --task_id "$TASK_ID" --result_dir "$EVIDENCE_DIR"

      - name: Verify CI Parity Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${TASK_ID:0:2}"
          MONTH="${TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          EVIDENCE_FILE="${EVIDENCE_DIR}/ci_parity_${TASK_ID}.json"
          ls -la "$EVIDENCE_DIR"
          if [ ! -f "$EVIDENCE_FILE" ]; then
            echo "Missing CI parity evidence: $EVIDENCE_FILE"
            exit 1
          fi

      - name: Generate Error Digest Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${TASK_ID:0:2}"
          MONTH="${TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          COMMIT=$(git rev-parse HEAD)
          node scripts/error_digest.mjs --task_id "$TASK_ID" --mode CI --commit "$COMMIT" --out_dir "$EVIDENCE_DIR"

      - name: Verify Error Digest Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${TASK_ID:0:2}"
          MONTH="${TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          EVIDENCE_FILE="${EVIDENCE_DIR}/errors_${TASK_ID}.jsonl"
          ls -la "$EVIDENCE_DIR"
          if [ ! -f "$EVIDENCE_FILE" ]; then
            echo "Missing error digest evidence: $EVIDENCE_FILE"
            exit 1
          fi

      - name: Generate Healthcheck Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${TASK_ID:0:2}"
          MONTH="${TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          ROOT_FILE="${EVIDENCE_DIR}/${TASK_ID}_healthcheck_53122_root.txt"
          PAIRS_FILE="${EVIDENCE_DIR}/${TASK_ID}_healthcheck_53122_pairs.txt"
          node scripts/mock_server.mjs > /tmp/mock_server_53122.log 2>&1 &
          echo $! > /tmp/mock_server_53122.pid
          trap 'if [ -f /tmp/mock_server_53122.pid ]; then kill "$(cat /tmp/mock_server_53122.pid)" || true; fi' EXIT
          READY=0
          for i in {1..30}; do
            if curl -sf http://localhost:53122/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Healthcheck server not ready after timeout."
            tail -n 200 /tmp/mock_server_53122.log || true
            if command -v lsof >/dev/null 2>&1; then
              lsof -i :53122 || true
            fi
            ps -ef | grep -E "mock_server|node scripts/mock_server" | grep -v grep || true
            exit 1
          fi
          curl --retry 5 --retry-delay 1 --retry-connrefused -s -i http://localhost:53122/ --output "$ROOT_FILE"
          curl --retry 5 --retry-delay 1 --retry-connrefused -s -i http://localhost:53122/pairs --output "$PAIRS_FILE"

      - name: Generate Gate Light Preview Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${TASK_ID:0:2}"
          MONTH="${TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          PREVIEW_LOG="${EVIDENCE_DIR}/gate_light_preview_${TASK_ID}.log"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          GENERATE_PREVIEW=1 node scripts/gate_light_ci.mjs --task_id "$TASK_ID" --result_dir "$EVIDENCE_DIR" > "$PREVIEW_LOG"
          node scripts/extract_gate_light_preview.mjs --task_id="$TASK_ID" --log="$PREVIEW_LOG"

      - name: Verify Healthcheck Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${TASK_ID:0:2}"
          MONTH="${TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          ROOT_FILE="${EVIDENCE_DIR}/${TASK_ID}_healthcheck_53122_root.txt"
          PAIRS_FILE="${EVIDENCE_DIR}/${TASK_ID}_healthcheck_53122_pairs.txt"
          ls -la "$EVIDENCE_DIR"
          if [ ! -f "$ROOT_FILE" ]; then
            echo "Missing healthcheck root evidence: $ROOT_FILE"
            exit 1
          fi
          if [ ! -f "$PAIRS_FILE" ]; then
            echo "Missing healthcheck pairs evidence: $PAIRS_FILE"
            exit 1
          fi

      - name: Generate DoD Notify Result Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF}"
          if [ -z "$TASK_REF" ]; then
            TASK_REF="${GITHUB_REF_NAME}"
          fi
          PR_TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          if [ -z "$PR_TASK_ID" ]; then
            echo "No task_id detected."
            exit 0
          fi
          YEAR="20${PR_TASK_ID:0:2}"
          MONTH="${PR_TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "PR_TASK_ID=${PR_TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          mkdir -p "$EVIDENCE_DIR"
          if [ -f "$EVIDENCE_DIR/notify_${PR_TASK_ID}.txt" ] && [ -f "$EVIDENCE_DIR/result_${PR_TASK_ID}.json" ]; then
            echo "Notify/Result already exist. Skip CI placeholder generation."
            exit 0
          fi
          PR_TASK_ID="$PR_TASK_ID" EVIDENCE_DIR="$EVIDENCE_DIR" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const taskId = process.env.PR_TASK_ID;
          const sha = process.env.GITHUB_SHA || '';
          const dir = process.env.EVIDENCE_DIR;
          if (!taskId || !dir) {
            console.error('Missing PR_TASK_ID or EVIDENCE_DIR');
            process.exit(1);
          }
          const notify = path.join(dir, `notify_${taskId}.txt`);
          const result = path.join(dir, `result_${taskId}.json`);
          const crypto = require('crypto');
          const parityRelative = `rules/task-reports/${dir.split('rules/task-reports/').pop()}/ci_parity_${taskId}.json`;
          const parityPath = path.join(dir, `ci_parity_${taskId}.json`);
          let paritySummary = `${parityRelative}`;
          if (fs.existsSync(parityPath)) {
            const parityHash = crypto.createHash('sha256').update(fs.readFileSync(parityPath)).digest('hex');
            paritySummary = `${parityRelative} sha256=${parityHash}`;
          } else {
            paritySummary = `${parityRelative} (missing)`;
          }
          const healthcheckRoot = `${dir}/${taskId}_healthcheck_53122_root.txt`;
          const healthcheckPairs = `${dir}/${taskId}_healthcheck_53122_pairs.txt`;
          const notifyContent = [
            '=== HEADER ===',
            `Header: TraeTask_${taskId}`,
            `task_id: ${taskId}`,
            'mode: CI',
            `commit: ${sha}`,
            '',
            '=== DOD_EVIDENCE_STDOUT ===',
            `DOD_EVIDENCE_HEALTHCHECK_ROOT: ${healthcheckRoot}`,
            `DOD_EVIDENCE_HEALTHCHECK_PAIRS: ${healthcheckPairs}`,
            `CI generated; healthcheck files: ${taskId}_healthcheck_53122_root.txt, ${taskId}_healthcheck_53122_pairs.txt`,
            '',
            '=== CI_PARITY_PREVIEW ===',
            paritySummary,
            '',
            'DOD_EVIDENCE_HEALTHCHECK_ROOT: / => HTTP/1.1 200 OK',
            'DOD_EVIDENCE_HEALTHCHECK_PAIRS: /pairs => HTTP/1.1 200 OK',
            '',
            'GATE_LIGHT_EXIT=0',
            ''
          ].join('\n');
          fs.writeFileSync(notify, notifyContent);
          const resultData = {
            task_id: taskId,
            mode: 'CI',
            status: 'PENDING',
            head_sha: sha,
            dod_evidence: {
              healthcheck: [
                `${taskId}_healthcheck_53122_root.txt`,
                `${taskId}_healthcheck_53122_pairs.txt`
              ],
              gate_light_exit: 0
            }
          };
          fs.writeFileSync(result, JSON.stringify(resultData, null, 2));
          NODE

      - name: Generate Trae Report Snippet Evidence
        run: |
          TASK_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          TASK_ID=$(echo "$TASK_REF" | grep -oE '[0-9]{6}_[0-9]{3}[A-Za-z]?' | head -n 1 || true)
          YEAR="20${TASK_ID:0:2}"
          MONTH="${TASK_ID:2:2}"
          EVIDENCE_DIR="rules/task-reports/${YEAR}-${MONTH}"
          echo "TASK_ID=${TASK_ID}"
          echo "EVIDENCE_DIR=${EVIDENCE_DIR}"
          NOTIFY_FILE="${EVIDENCE_DIR}/notify_${TASK_ID}.txt"
          SNIPPET_FILE="${EVIDENCE_DIR}/trae_report_snippet_${TASK_ID}.txt"
          if [ -f "$SNIPPET_FILE" ]; then
            echo "Snippet already exists. Skip CI placeholder generation."
            exit 0
          fi
          if [ ! -f "$NOTIFY_FILE" ]; then
            echo "Missing notify evidence for snippet: $NOTIFY_FILE"
            exit 1
          fi
          GATE_LIGHT_GENERATE_PREVIEW=1 node scripts/build_trae_report_snippet.mjs --task_id="$TASK_ID" --result_dir="$EVIDENCE_DIR"
          TASK_ID="$TASK_ID" EVIDENCE_DIR="$EVIDENCE_DIR" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const taskId = process.env.TASK_ID;
          const dir = process.env.EVIDENCE_DIR;
          const snippetPath = path.join(dir, `trae_report_snippet_${taskId}.txt`);
          const content = fs.readFileSync(snippetPath, 'utf8');
          if (!/^Header:\s*/m.test(content)) {
            fs.writeFileSync(snippetPath, `Header: TraeTask_${taskId}\n` + content);
          }
          NODE

      - name: Run Gate Light CI
        run: |
          git fetch origin main
          node scripts/gate_light_ci.mjs


