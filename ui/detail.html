<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OppRadar — 快照详情</title>
  <link rel="stylesheet" href="/ui/styles.css">
  <style>
    .section       { margin: 1.2em 0; padding: 1em; border: 1px solid #2d3048; border-radius: 4px; background: #1a1d27; }
    .section h2    { margin: 0 0 0.7em; font-size: 1.05em; color: #a0a8ff; border-bottom: 1px solid #2d3048; padding-bottom: 0.4em; }
    .field         { display: flex; gap: 0.8em; margin: 0.35em 0; font-size: 0.95em; }
    .field label   { font-weight: bold; min-width: 120px; color: #8888a0; flex-shrink: 0; }
    .tags          { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag-item      { background: #2d3048; color: #c0c8ff; border-radius: 3px; padding: 1px 7px; font-size: 0.85em; }
    ul.triggers    { margin: 0; padding-left: 1.2em; font-size: 0.95em; }
    .timeline      { list-style: none; padding: 0; margin: 0; }
    .timeline li   { padding: 3px 0; border-bottom: 1px solid #2d3048; font-size: 0.88em; color: #8888a0; }
    .not-found     { padding: 2em; text-align: center; color: #8888a0; }
    a.back-link    { display: inline-block; margin-bottom: 0.8em; font-size: 0.95em; }
    nav            { font-size: 0.9em; margin-top: 0.3em; }
    .deep-section  { margin: 1.2em 0; }
    .deep-btn      { background: #2a6496; color: #fff; border: none; padding: 0.55em 1.4em;
                     border-radius: 4px; cursor: pointer; font-size: 1em; }
    .deep-btn:disabled { opacity: 0.5; cursor: default; }
    #deep-out      { margin-top: 0.8em; white-space: pre-wrap; font-size: 0.88em;
                     background: #0a0c12; border: 1px solid #2a2d40; border-radius: 4px;
                     padding: 0.8em; display: none; color: #ccc; }
  </style>
</head>
<body>
<header>
  <h1>OppRadar <span class="tag">快照详情</span></h1>
  <nav><a href="/ui/oppradar_v2.html">📡 OppRadar</a></nav>
</header>

<main>
  <a class="back-link" href="/ui/oppradar_v2.html">← 返回列表</a>
  <div id="content"></div>
</main>

<script>
function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function fmtPercent(val) {
  if (val == null) return '—';
  return (val * 100).toFixed(1) + '%';
}

function fmtTime(iso) {
  if (!iso) return '—';
  return iso.slice(0, 19).replace('T', ' ');
}

function vetoClass(decision) {
  if (decision === 'ALLOW')   return 'veto-allow';
  if (decision === 'DEGRADE') return 'veto-degrade';
  if (decision === 'BLOCK')   return 'veto-block';
  return '';
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function field(label, value) {
  var safeVal = (value != null && value !== '') ? value : '—';
  return '<div class="field"><label>' + esc(label) + '</label><span>' + safeVal + '</span></div>';
}

async function load() {
  var oppId = getParam('opp_id');
  var el    = document.getElementById('content');

  if (!oppId) {
    el.innerHTML = '<div class="not-found">机会不存在或暂无快照</div>';
    return;
  }

  var snapList   = null;
  var latestSnap = null;

  try {
    var r1 = await fetch('/snapshots/' + encodeURIComponent(oppId));
    if (r1.ok) snapList = await r1.json();
  } catch (e) { /* ignore */ }

  try {
    var r2 = await fetch('/snapshots/' + encodeURIComponent(oppId) + '/latest');
    if (r2.ok) latestSnap = await r2.json();
  } catch (e) { /* ignore */ }

  if (!latestSnap && !snapList) {
    el.innerHTML = '<div class="not-found">机会不存在或暂无快照</div>';
    return;
  }

  var snap     = latestSnap || {};
  var veto     = snap.veto || {};
  var triggers = Array.isArray(snap.risk_triggers) ? snap.risk_triggers : [];
  var allSnaps = (snapList && Array.isArray(snapList.snapshots)) ? snapList.snapshots : [];

  var html = '';

  // ── Section 1: 机会 ──────────────────────────────────────
  html += '<div class="section"><h2>1. 机会</h2>';
  html += field('标题', esc(snap.title));
  var urlVal = snap.market_url
    ? '<a href="' + esc(snap.market_url) + '" target="_blank">' + esc(snap.market_url) + '</a>'
    : null;
  html += field('市场链接', urlVal);
  html += field('结算时间', esc(snap.event_time));
  html += field('YES 价格 (Market%)', fmtPercent(snap.yes_price));
  html += '</div>';

  // ── Section 2: 触发 ──────────────────────────────────────
  var topTriggers = triggers.slice(0, 3);
  html += '<div class="section"><h2>2. 触发</h2>';
  if (topTriggers.length === 0) {
    html += '<p style="margin:0;color:#999">—</p>';
  } else {
    html += '<ul class="triggers">' +
      topTriggers.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') +
      '</ul>';
  }
  html += '</div>';

  // ── Section 3: 否决 ──────────────────────────────────────
  var decision = veto.decision || '—';
  var labels   = Array.isArray(veto.labels) ? veto.labels : [];
  html += '<div class="section"><h2>3. 否决</h2>';
  html += field('决定', '<span class="' + vetoClass(decision) + '">' + esc(decision) + '</span>');
  html += '<div class="field"><label>标签</label><div class="tags">' +
    (labels.length > 0
      ? labels.map(function(l){ return '<span class="tag-item">' + esc(l) + '</span>'; }).join('')
      : '<span>—</span>') +
    '</div></div>';
  html += '</div>';

  // ── Section 4: 置信 ──────────────────────────────────────
  html += '<div class="section"><h2>4. 置信</h2>';
  html += field('置信度',   esc(snap.confidence));
  html += field('模型',     esc(snap.model_used));
  html += field('快照类型', esc(snap.snapshot_type));
  html += field('模型角色 (model_role)', esc(snap.model_role));
  html += field('延迟 (latency_ms)', snap.latency_ms != null ? snap.latency_ms + ' ms' : null);
  html += '</div>';

  // ── Section 4.5: 偏差分析 ────────────────────────────────
  var devFlagVal = snap.dev_flag || null;
  var devFlagCls = devFlagVal === 'UNDER' ? 'dev-under' : devFlagVal === 'OVER' ? 'dev-over' : 'dev-fair';
  var devSignedFmt = snap.dev_signed != null
    ? (snap.dev_signed >= 0 ? '+' : '') + (snap.dev_signed * 100).toFixed(1) + '%'
    : null;
  var devAbsFmt = snap.dev_abs != null
    ? (snap.dev_abs * 100).toFixed(1) + '%'
    : null;
  var pMidFmt = snap.p_mid != null
    ? (snap.p_mid * 100).toFixed(1) + '%'
    : null;
  html += '<div class="section"><h2>4.5 偏差分析</h2>';
  html += field('p_mid（模型中值）', pMidFmt);
  html += field('dev_signed（偏差）', devSignedFmt);
  html += field('dev_abs（绝对偏差）', devAbsFmt);
  html += field('dev_flag（方向）',
    devFlagVal ? '<span class="' + devFlagCls + '">' + esc(devFlagVal) + '</span>' : null);
  html += field('mispricing_type', esc(snap.mispricing_type));
  html += field('why_1_liner', esc(snap.why_1_liner));
  html += field('what_to_check', esc(snap.what_to_check));
  html += '</div>';

  // ── 深挖 button ──────────────────────────────────────────
  // Use data attribute to avoid double-quote conflict in onclick HTML attribute
  var safeOppId = (oppId || '').replace(/'/g, "\\'");
  html += '<div class="deep-section">' +
    '<button class="deep-btn" id="deep-btn" onclick="triggerDeep(\'' + safeOppId + '\')">🔬 深挖</button>' +
    '<pre id="deep-out"></pre>' +
    '</div>';

  // ── Section 5: 快照时间线 ────────────────────────────────
  html += '<div class="section"><h2>5. 快照时间线</h2>';
  if (allSnaps.length === 0) {
    html += '<p style="margin:0;color:#999">—</p>';
  } else {
    html += '<ul class="timeline">';
    var rev = allSnaps.slice().reverse();
    for (var i = 0; i < rev.length; i++) {
      var s = rev[i];
      html += '<li>' +
        fmtTime(s.created_at) + ' &nbsp;|&nbsp; ' +
        esc(s.snapshot_type || '—') + ' &nbsp;|&nbsp; ' +
        esc(s.model_used    || '—') +
        '</li>';
    }
    html += '</ul>';
  }
  html += '</div>';

  el.innerHTML = html;
}

async function triggerDeep(oppId) {
  var btn = document.getElementById('deep-btn');
  var out = document.getElementById('deep-out');
  if (!btn || !out) return;
  btn.disabled = true;
  btn.textContent = '⏳ 深挖中…';
  out.style.display = 'block';
  out.textContent = '正在调用 Gemini 2.0 Flash，请稍候（最多 60 秒）…';
  try {
    var res = await fetch('/snapshots/' + encodeURIComponent(oppId) + '/deep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    var data = await res.json();
    if (res.ok) {
      out.textContent = JSON.stringify(data, null, 2);
      btn.textContent = '✅ 深挖完成';
    } else {
      out.textContent = '错误 ' + res.status + ': ' + (data.error || JSON.stringify(data));
      btn.textContent = '❌ 深挖失败';
      btn.disabled = false;
    }
  } catch (e) {
    out.textContent = '请求失败: ' + e.message;
    btn.textContent = '❌ 深挖失败';
    btn.disabled = false;
  }
}

window.onload = load;
</script>
</body>
</html>
