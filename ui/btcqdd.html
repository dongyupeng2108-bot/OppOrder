<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTCQDD v1.5</title>
<script>
/* ═══════════════════════════════════════════════════
   STEP 1: Design Tokens — Method A (inline)
   Source: taskfiles/btcqdd_design_tokens.js
   ═══════════════════════════════════════════════════ */
const BG = {
  base:     "#060612",
  panel:    "#080814",
  card:     "#0b0b1a",
  surface:  "#0a0a18",
  chart:    "#08081a",
  elevated: "#0e0e22",
};
const BORDER = {
  default:  "#12122a",
  subtle:   "#10102a",
  slider:   "#141428",
};
const COLOR = {
  up:       "#26a69a",
  down:     "#ef5350",
  primary:  "#6366f1",
  accent:   "#0ea5e9",
  warn:     "#f59e0b",
  sim:      "#3b82f6",
};
const TEXT = {
  primary:   "#ccc",
  secondary: "#aaa",
  body:      "#888",
  muted:     "#666",
  dim:       "#555",
  faint:     "#444",
  ghost:     "#333",
  invisible: "#2a2a40",
  dead:      "#1a1a2e",
  placeholder:"#12122a",
};
const FONT = {
  mono:  "'JetBrains Mono', 'Fira Code', monospace",
  body:  "'Noto Sans SC', 'SF Pro Text', -apple-system, sans-serif",
};
const SIZE = {
  hero: 18, title: 15, heading: 14, lg: 13, md: 12,
  base: 11, sm: 10, xs: 9, xxs: 8, micro: 7,
};
const WEIGHT = { black: 800, bold: 700, semi: 600, normal: 400 };
const LAYOUT = {
  topbar_h: 36, sidebar_w: 180, orderbook_w: 164,
};
const SPACE = {
  page: 14, card: 12, panel: 10, gap_lg: 12, gap_md: 8, gap_sm: 6, gap_xs: 3,
};
const RADIUS = { lg: 8, md: 6, sm: 5, xs: 3, pill: 7, round: 50 };
const CHART_STYLE = { bg: BG.chart, gridColor: "#0e0e20" };
const TRANSITION = { toggle: "all 0.15s" };

/* ═══════════════════════════════════════════════════
   CSS Variable Injection into :root
   ═══════════════════════════════════════════════════ */
function initTokens() {
  const r = document.documentElement;
  /* backgrounds */
  r.style.setProperty('--bg-base',     BG.base);
  r.style.setProperty('--bg-panel',    BG.panel);
  r.style.setProperty('--bg-card',     BG.card);
  r.style.setProperty('--bg-surface',  BG.surface);
  r.style.setProperty('--bg-chart',    BG.chart);
  r.style.setProperty('--bg-elevated', BG.elevated);
  /* borders */
  r.style.setProperty('--border',        BORDER.default);
  r.style.setProperty('--border-subtle', BORDER.subtle);
  r.style.setProperty('--border-slider', BORDER.slider);
  /* semantic colors */
  r.style.setProperty('--color-up',      COLOR.up);
  r.style.setProperty('--color-down',    COLOR.down);
  r.style.setProperty('--color-primary', COLOR.primary);
  r.style.setProperty('--color-accent',  COLOR.accent);
  r.style.setProperty('--color-warn',    COLOR.warn);
  r.style.setProperty('--color-sim',     COLOR.sim);
  /* text */
  r.style.setProperty('--text-primary',   TEXT.primary);
  r.style.setProperty('--text-secondary', TEXT.secondary);
  r.style.setProperty('--text-body',      TEXT.body);
  r.style.setProperty('--text-muted',     TEXT.muted);
  r.style.setProperty('--text-dim',       TEXT.dim);
  r.style.setProperty('--text-faint',     TEXT.faint);
  r.style.setProperty('--text-ghost',     TEXT.ghost);
  r.style.setProperty('--text-invisible', TEXT.invisible);
  r.style.setProperty('--text-dead',      TEXT.dead);
  /* fonts */
  r.style.setProperty('--font-mono', FONT.mono);
  r.style.setProperty('--font-body', FONT.body);
  /* sizes */
  r.style.setProperty('--size-hero',    SIZE.hero    + 'px');
  r.style.setProperty('--size-title',   SIZE.title   + 'px');
  r.style.setProperty('--size-heading', SIZE.heading + 'px');
  r.style.setProperty('--size-lg',      SIZE.lg      + 'px');
  r.style.setProperty('--size-md',      SIZE.md      + 'px');
  r.style.setProperty('--size-base',    SIZE.base    + 'px');
  r.style.setProperty('--size-sm',      SIZE.sm      + 'px');
  r.style.setProperty('--size-xs',      SIZE.xs      + 'px');
  r.style.setProperty('--size-xxs',     SIZE.xxs     + 'px');
  r.style.setProperty('--size-micro',   SIZE.micro   + 'px');
  /* weights */
  r.style.setProperty('--weight-black',  WEIGHT.black);
  r.style.setProperty('--weight-bold',   WEIGHT.bold);
  r.style.setProperty('--weight-semi',   WEIGHT.semi);
  r.style.setProperty('--weight-normal', WEIGHT.normal);
  /* layout */
  r.style.setProperty('--topbar-h',    LAYOUT.topbar_h    + 'px');
  r.style.setProperty('--sidebar-w',   LAYOUT.sidebar_w   + 'px');
  r.style.setProperty('--orderbook-w', LAYOUT.orderbook_w + 'px');
  /* spacing */
  r.style.setProperty('--space-page',   SPACE.page   + 'px');
  r.style.setProperty('--space-card',   SPACE.card   + 'px');
  r.style.setProperty('--space-panel',  SPACE.panel  + 'px');
  r.style.setProperty('--space-gap-lg', SPACE.gap_lg + 'px');
  r.style.setProperty('--space-gap-md', SPACE.gap_md + 'px');
  r.style.setProperty('--space-gap-sm', SPACE.gap_sm + 'px');
  r.style.setProperty('--space-gap-xs', SPACE.gap_xs + 'px');
  /* radii */
  r.style.setProperty('--radius-lg',   RADIUS.lg   + 'px');
  r.style.setProperty('--radius-md',   RADIUS.md   + 'px');
  r.style.setProperty('--radius-sm',   RADIUS.sm   + 'px');
  r.style.setProperty('--radius-xs',   RADIUS.xs   + 'px');
  r.style.setProperty('--radius-pill', RADIUS.pill + 'px');
  /* chart */
  r.style.setProperty('--chart-bg',   CHART_STYLE.bg);
  r.style.setProperty('--chart-grid', CHART_STYLE.gridColor);
  /* transition */
  r.style.setProperty('--transition-toggle', TRANSITION.toggle);
}
initTokens();
</script>
<style>
/* ═══════════════════════════════════════════════════
   Base Reset & Layout — all values from CSS vars
   ═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-base);
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: var(--size-base);
  font-weight: var(--weight-normal);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Scrollbar */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: var(--bg-base); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-xs); }

/* ─── Top Bar ─────────────────────────────────────── */
#topbar {
  height: var(--topbar-h);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-page);
  gap: var(--space-gap-md);
  flex-shrink: 0;
  z-index: 10;
}

.topbar-brand {
  font-size: var(--size-heading);
  font-weight: var(--weight-black);
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.topbar-brand .btc { color: var(--color-primary); }
.topbar-brand .qdd { color: var(--text-invisible); }

.topbar-divider {
  width: 1px;
  height: 14px;
  background: var(--border);
}

.topbar-status {
  display: flex;
  align-items: center;
  gap: var(--space-gap-sm);
  flex: 1;
  justify-content: center;
}

#status-dot {
  width: 7px;
  height: 7px;
  border-radius: var(--radius-pill);
  background: var(--text-ghost);
  flex-shrink: 0;
  transition: var(--transition-toggle);
}

#status-label {
  font-size: var(--size-xs);
  color: var(--text-ghost);
}

.topbar-url {
  font-size: var(--size-xxs);
  color: var(--text-invisible);
  font-family: var(--font-mono);
}

.topbar-window {
  display: flex;
  align-items: center;
  gap: var(--space-gap-sm);
  flex-shrink: 0;
}

.topbar-window-label {
  font-size: var(--size-xxs);
  color: var(--text-invisible);
}

.topbar-window-val {
  font-family: var(--font-mono);
  font-size: var(--size-sm);
  color: var(--text-ghost);
  font-weight: var(--weight-semi);
  background: var(--bg-elevated);
  border-radius: var(--radius-xs);
  padding: 2px 6px;
}

.topbar-version {
  font-size: var(--size-xxs);
  color: var(--text-invisible);
  flex-shrink: 0;
}

/* ─── Main Layout ─────────────────────────────────── */
#layout {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ─── Sidebar ─────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--bg-panel);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}

.sidebar-header {
  padding: var(--space-panel);
  border-bottom: 1px solid var(--border-subtle);
  font-size: var(--size-xxs);
  font-weight: var(--weight-semi);
  color: var(--text-invisible);
  letter-spacing: 1px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--space-gap-sm);
  padding: 9px var(--space-panel);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: var(--transition-toggle);
}

.nav-item:hover {
  background: var(--bg-elevated);
}

.nav-item.active {
  border-left-color: var(--color-primary);
  background: var(--bg-elevated);
}

.nav-item.active .nav-label {
  color: var(--text-primary);
}

.nav-icon {
  font-size: var(--size-md);
  width: 18px;
  text-align: center;
}

.nav-label {
  font-size: var(--size-base);
  font-weight: var(--weight-semi);
  color: var(--text-muted);
}

.sidebar-footer {
  margin-top: auto;
  padding: var(--space-panel);
  border-top: 1px solid var(--border-subtle);
}

.conn-row {
  display: flex;
  align-items: center;
  gap: var(--space-gap-sm);
  margin-bottom: 3px;
}

.conn-dot {
  width: 4px;
  height: 4px;
  border-radius: 2px;
  background: var(--color-up);
  flex-shrink: 0;
}

.conn-name {
  font-size: var(--size-xxs);
  color: var(--text-ghost);
}

.conn-latency {
  font-family: var(--font-mono);
  font-size: var(--size-xxs);
  color: var(--color-up);
  margin-left: auto;
}

/* ─── Main Area ───────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.chart-header {
  height: 28px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-card);
  gap: var(--space-gap-md);
  flex-shrink: 0;
}

.chart-title {
  font-size: var(--size-sm);
  font-weight: var(--weight-semi);
  color: var(--text-dim);
}

.chart-price {
  font-family: var(--font-mono);
  font-size: var(--size-md);
  font-weight: var(--weight-bold);
  color: var(--text-primary);
}

.chart-price-label {
  font-size: var(--size-xxs);
  color: var(--text-invisible);
}

.chart-spacer { flex: 1; }

.chart-tf-row {
  height: 24px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-card);
  gap: 2px;
  flex-shrink: 0;
}

.tf-btn {
  padding: 2px 8px;
  border-radius: var(--radius-xs);
  font-size: var(--size-xs);
  font-weight: var(--weight-semi);
  font-family: var(--font-mono);
  color: var(--text-faint);
  cursor: pointer;
  background: transparent;
  border: none;
}

.tf-btn.active {
  background: var(--color-primary);
  color: var(--text-primary);
}

/* SVG Chart Container */
.chart-container {
  flex: 1;
  background: var(--bg-chart);
  border-bottom: 1px solid var(--border);
  min-height: 160px;
  position: relative;
  overflow: hidden;
}

#price-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Price polyline */
.price-line {
  fill: none;
  stroke: var(--color-accent);
  stroke-width: 1.5;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.price-line-area {
  fill: url(#price-area-grad);
  stroke: none;
}

.chart-grid-line { stroke: var(--chart-grid); stroke-width: 0.5; }
.chart-axis-line { stroke: var(--border);     stroke-width: 1; }
.chart-label {
  fill: var(--text-invisible);
  font-family: var(--font-mono);
  font-size: 7px;
}

/* Win-rate section */
.winrate-section {
  flex-shrink: 0;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
}

.winrate-header {
  display: flex;
  align-items: center;
  padding: 3px var(--space-card);
  border-bottom: 1px solid var(--border);
  gap: var(--space-gap-md);
}

.winrate-chart-wrap {
  position: relative;
  overflow: hidden;
}

#winrate-svg {
  display: block;
  width: 100%;
  height: 64px;
}

.winrate-placeholder {
  fill: var(--text-dead);
  font-family: var(--font-mono);
  font-size: 8px;
}

.winrate-line {
  fill: none;
  stroke: var(--color-sim);
  stroke-width: 1.5;
}

/* Bottom log panel */
.bottom-panel {
  flex-shrink: 0;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
}

.bottom-panel-header {
  display: flex;
  align-items: center;
  padding: 4px var(--space-card);
  border-bottom: 1px solid var(--border);
  gap: var(--space-gap-md);
}

.bottom-panel-title {
  font-size: var(--size-xxs);
  font-weight: var(--weight-semi);
  color: var(--text-invisible);
  letter-spacing: 1px;
}

.log-area {
  max-height: 48px;
  overflow-y: auto;
  padding: 2px 0;
}

.log-row {
  display: flex;
  align-items: center;
  gap: var(--space-gap-md);
  padding: 1px var(--space-card);
}

.log-ts {
  font-family: var(--font-mono);
  font-size: var(--size-xxs);
  color: var(--text-dead);
  flex-shrink: 0;
  width: 52px;
}

.log-msg {
  font-size: var(--size-xxs);
  color: var(--text-faint);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ─── Info Panel (Right) ──────────────────────────── */
#info {
  width: var(--orderbook-w);
  background: var(--bg-panel);
  border-left: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: auto;
}

.info-section {
  padding: var(--space-panel);
}

.info-section + .info-section {
  border-top: 1px solid var(--border-subtle);
}

.info-section-title {
  font-size: var(--size-xxs);
  font-weight: var(--weight-semi);
  color: var(--text-invisible);
  letter-spacing: 1px;
  margin-bottom: var(--space-gap-sm);
}

/* Order book rows */
.ob-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 0;
}

.ob-label {
  font-size: var(--size-xxs);
  color: var(--text-ghost);
}

.ob-val {
  font-family: var(--font-mono);
  font-size: var(--size-xs);
  color: var(--text-secondary);
}

.ob-val.ask { color: var(--color-down); }
.ob-val.bid { color: var(--color-up); }
.ob-val.warn { color: var(--color-warn); }

.ob-divider {
  border-top: 1px solid var(--border-subtle);
  margin: 4px 0;
}

/* Regime gauge */
.regime-bar-wrap {
  width: 100%;
  height: 6px;
  background: var(--border-slider);
  border-radius: var(--radius-xs);
  margin-bottom: var(--space-gap-sm);
  overflow: hidden;
}

.regime-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: var(--radius-xs);
  background: var(--color-warn);
  transition: var(--transition-toggle);
}

.regime-score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-gap-sm);
}

.regime-score-val {
  font-family: var(--font-mono);
  font-size: var(--size-heading);
  font-weight: var(--weight-bold);
  color: var(--text-ghost);
}

.regime-tag-row {
  display: flex;
  gap: var(--space-gap-xs);
  margin-bottom: var(--space-gap-sm);
  flex-wrap: wrap;
}

.regime-tag {
  font-family: var(--font-mono);
  font-size: var(--size-micro);
  padding: 1px 5px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border);
  color: var(--text-ghost);
  background: var(--bg-elevated);
}

.regime-tag.active {
  border-color: var(--color-up);
  color: var(--color-up);
  background: var(--bg-elevated);
}

/* Book mid display */
.book-mid-row {
  text-align: center;
  padding: 4px 0;
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
  margin: 3px 0;
}

.book-mid-val {
  font-family: var(--font-mono);
  font-size: var(--size-lg);
  font-weight: var(--weight-bold);
  color: var(--text-primary);
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     TOP BAR
     ══════════════════════════════════════════════ -->
<div id="topbar">
  <div class="topbar-brand">
    <span class="btc">BTC</span><span class="qdd">QDD</span>
  </div>
  <div class="topbar-divider"></div>
  <div class="topbar-status">
    <div id="status-dot"></div>
    <span id="status-label">连接中…</span>
    <span class="topbar-url">localhost:53123</span>
  </div>
  <div class="topbar-window">
    <span class="topbar-window-label">当前窗口</span>
    <span class="topbar-window-val" id="window-val">等待数据…</span>
  </div>
  <div class="topbar-divider"></div>
  <span class="topbar-version">v1.5</span>
</div>

<!-- ══════════════════════════════════════════════
     THREE-COLUMN LAYOUT
     ══════════════════════════════════════════════ -->
<div id="layout">

  <!-- ── LEFT SIDEBAR NAV ──────────────────────── -->
  <div id="sidebar">
    <div class="sidebar-header">导航</div>

    <div class="nav-item active" data-tab="hall" onclick="switchTab('hall')">
      <span class="nav-icon">📈</span>
      <span class="nav-label">交易大厅</span>
    </div>
    <div class="nav-item" data-tab="lab" onclick="switchTab('lab')">
      <span class="nav-icon">🧪</span>
      <span class="nav-label">策略实验室</span>
    </div>
    <div class="nav-item" data-tab="postmortem" onclick="switchTab('postmortem')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">复盘分析</span>
    </div>
    <div class="nav-item" data-tab="settings" onclick="switchTab('settings')">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">系统设置</span>
    </div>

    <div class="sidebar-footer">
      <div class="conn-row">
        <div class="conn-dot" id="ws-dot"></div>
        <span class="conn-name">事件流 WS</span>
        <span class="conn-latency" id="ws-status">--</span>
      </div>
      <div class="conn-row">
        <div class="conn-dot"></div>
        <span class="conn-name">REST API</span>
        <span class="conn-latency" id="api-status">--</span>
      </div>
    </div>
  </div>

  <!-- ── MAIN CENTER AREA ──────────────────────── -->
  <div id="main">
    <!-- Chart header bar -->
    <div class="chart-header">
      <span class="chart-title">BTC/USD · mid</span>
      <span class="chart-price-label">最新</span>
      <span class="chart-price" id="current-price">--</span>
      <div class="chart-spacer"></div>
    </div>

    <!-- Price polyline SVG (replaces static K-line) -->
    <div class="chart-container">
      <svg id="price-svg" viewBox="0 0 800 240" preserveAspectRatio="none">
        <defs>
          <linearGradient id="price-area-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="var(--color-accent)" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <!-- Chart background -->
        <rect x="0" y="0" width="800" height="240" fill="var(--bg-chart)"/>

        <!-- Grid lines -->
        <line class="chart-grid-line" x1="0" y1="48"  x2="800" y2="48"/>
        <line class="chart-grid-line" x1="0" y1="96"  x2="800" y2="96"/>
        <line class="chart-grid-line" x1="0" y1="144" x2="800" y2="144"/>
        <line class="chart-grid-line" x1="0" y1="192" x2="800" y2="192"/>

        <!-- Area fill under line -->
        <polygon id="price-area" class="price-line-area" points=""/>

        <!-- Price polyline -->
        <polyline id="price-line" class="price-line" points=""/>

        <!-- Current price label in chart -->
        <text id="price-chart-label" class="chart-label" x="8" y="20" fill="var(--color-accent)">--</text>

        <!-- Empty state placeholder (hidden when data arrives) -->
        <text id="price-placeholder" fill="var(--text-placeholder)" font-family="var(--font-mono)"
              font-size="9" x="400" y="125" text-anchor="middle">等待价格数据…（5s 刷新）</text>
      </svg>
    </div>

    <!-- Time-frame selector -->
    <div class="chart-tf-row">
      <button class="tf-btn" onclick="setTf(this,'5M')">5M</button>
      <button class="tf-btn active" onclick="setTf(this,'15M')">15M</button>
      <button class="tf-btn" onclick="setTf(this,'1H')">1H</button>
      <button class="tf-btn" onclick="setTf(this,'4H')">4H</button>
      <button class="tf-btn" onclick="setTf(this,'1D')">1D</button>
    </div>

    <!-- Win-rate chart section -->
    <div class="winrate-section">
      <div class="winrate-header">
        <span class="bottom-panel-title">胜率曲线</span>
        <span id="winrate-status" style="font-size:var(--size-micro);color:var(--text-dead);margin-left:auto"></span>
      </div>
      <div class="winrate-chart-wrap">
        <svg id="winrate-svg">
          <!-- Grid -->
          <line class="chart-grid-line" x1="0" y1="32" x2="9999" y2="32"/>
          <!-- Win rate line -->
          <polyline id="winrate-line" class="winrate-line" points=""/>
          <!-- Placeholder text (shown when no data) -->
          <text id="winrate-placeholder" class="winrate-placeholder"
                x="50%" y="36" text-anchor="middle">
            数据积累中，至少需要 3 个窗口
          </text>
        </svg>
      </div>
    </div>

    <!-- Bottom log panel -->
    <div class="bottom-panel">
      <div class="bottom-panel-header">
        <span class="bottom-panel-title">实时日志</span>
      </div>
      <div class="log-area" id="log-area">
        <div class="log-row">
          <span class="log-ts">--:--:--</span>
          <span class="log-msg">等待服务连接…</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── RIGHT INFO PANEL ───────────────────────── -->
  <div id="info">

    <!-- Order book — real-time -->
    <div class="info-section">
      <div class="info-section-title">盘口</div>

      <div class="ob-row">
        <span class="ob-label">Ask</span>
        <span class="ob-val ask" id="ob-ask">--</span>
      </div>
      <div class="ob-row">
        <span class="ob-label">Bid</span>
        <span class="ob-val bid" id="ob-bid">--</span>
      </div>

      <div class="book-mid-row">
        <span class="book-mid-val" id="ob-mid">--</span>
      </div>

      <div class="ob-row">
        <span class="ob-label">Spread</span>
        <span class="ob-val warn" id="ob-spread">--</span>
      </div>
      <div class="ob-row">
        <span class="ob-label">Tick</span>
        <span class="ob-val" id="ob-tick">--</span>
      </div>
      <div class="ob-row">
        <span class="ob-label">更新</span>
        <span class="ob-val" id="ob-updated" style="color:var(--text-dead)">--</span>
      </div>
    </div>

    <!-- Regime gauge — real-time -->
    <div class="info-section">
      <div class="info-section-title">市场状态</div>

      <!-- Progress bar -->
      <div class="regime-bar-wrap">
        <div class="regime-bar-fill" id="regime-bar"></div>
      </div>

      <!-- Score value -->
      <div class="regime-score-row">
        <span class="ob-label">Score</span>
        <span class="regime-score-val" id="regime-score-label">--</span>
      </div>

      <!-- Activation zone tags -->
      <div class="regime-tag-row">
        <span class="regime-tag" id="regime-s1-tag">S1 ≥0.5</span>
        <span class="regime-tag" id="regime-s2-tag">S2 ≥0.6</span>
      </div>

      <div class="ob-divider"></div>

      <!-- Sub-dimension scores -->
      <div class="ob-row">
        <span class="ob-label">Trend</span>
        <span class="ob-val" id="regime-trend">--</span>
      </div>
      <div class="ob-row">
        <span class="ob-label">Alt</span>
        <span class="ob-val" id="regime-alt">--</span>
      </div>
      <div class="ob-row">
        <span class="ob-label">Vol</span>
        <span class="ob-val" id="regime-vol">--</span>
      </div>

      <div class="ob-divider"></div>

      <!-- Last window info -->
      <div class="ob-row">
        <span class="ob-label">窗口</span>
        <span class="ob-val" id="regime-window" style="color:var(--text-dead)">--</span>
      </div>
    </div>

  </div>

</div><!-- #layout -->

<!-- ══════════════════════════════════════════════
     SCRIPTS: Real-time data + Navigation + TF
     ══════════════════════════════════════════════ -->
<script>
const BASE_URL = 'http://localhost:53123';

/* ─── Log ────────────────────────────────────── */
function addLog(msg) {
  const area = document.getElementById('log-area');
  if (!area) return;
  const row = document.createElement('div');
  row.className = 'log-row';
  const now = new Date();
  const ts = now.toTimeString().slice(0, 8);
  row.innerHTML = `<span class="log-ts">${ts}</span><span class="log-msg">${msg}</span>`;
  area.insertBefore(row, area.firstChild);
  while (area.children.length > 20) area.removeChild(area.lastChild);
}

/* ─── Service Health Polling ─────────────────── */
function setServiceStatus(status) {
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  const apiEl = document.getElementById('api-status');
  const colors = {
    online:  COLOR.up,
    offline: COLOR.down,
    error:   COLOR.warn,
  };
  dot.style.background  = colors[status] ?? TEXT.ghost;
  label.textContent = {
    online:  '服务正常',
    offline: '服务离线',
    error:   '服务异常',
  }[status] ?? status;
  label.style.color = colors[status] ?? TEXT.ghost;
  if (apiEl) {
    apiEl.textContent = status === 'online' ? 'ok' : status;
    apiEl.style.color = colors[status] ?? TEXT.ghost;
  }
}

async function checkHealth() {
  try {
    const t0 = Date.now();
    const res = await fetch(BASE_URL + '/', { signal: AbortSignal.timeout(3000) });
    const ms = Date.now() - t0;
    const apiEl = document.getElementById('api-status');
    if (apiEl) apiEl.textContent = ms + 'ms';
    setServiceStatus(res.ok ? 'online' : 'error');
  } catch {
    setServiceStatus('offline');
  }
}

checkHealth();
setInterval(checkHealth, 5000);

/* ─── Price Chart ─────────────────────────────── */
const priceHistory = [];
const MAX_POINTS = 60;

function updatePriceChart(snapshot) {
  const price = snapshot.mid ?? snapshot.best_bid ?? null;
  if (price == null) return;
  priceHistory.push(price);
  if (priceHistory.length > MAX_POINTS) priceHistory.shift();
  renderPriceChart();
  // Update header price label
  const el = document.getElementById('current-price');
  if (el) {
    el.textContent = price.toFixed(2);
    el.style.color = priceHistory.length < 2
      ? TEXT.primary
      : (price >= priceHistory[priceHistory.length - 2] ? COLOR.up : COLOR.down);
  }
}

function renderPriceChart() {
  if (priceHistory.length < 2) return;

  const svg = document.getElementById('price-svg');
  const vw = 800, vh = 240; // viewBox dims

  const minP = Math.min(...priceHistory) * 0.999;
  const maxP = Math.max(...priceHistory) * 1.001;
  const range = maxP - minP || 1;

  const pts = priceHistory.map((p, i) => {
    const x = (i / (MAX_POINTS - 1)) * vw;
    const y = vh - ((p - minP) / range) * (vh - 10) - 5;
    return [x.toFixed(1), y.toFixed(1)];
  });

  const pointsStr = pts.map(([x, y]) => `${x},${y}`).join(' ');

  const line = document.getElementById('price-line');
  if (line) line.setAttribute('points', pointsStr);

  // Area polygon: close down to bottom
  const areaEl = document.getElementById('price-area');
  if (areaEl) {
    const first = pts[0];
    const last  = pts[pts.length - 1];
    const area  = pointsStr + ` ${last[0]},${vh} ${first[0]},${vh}`;
    areaEl.setAttribute('points', area);
  }

  // Label
  const labelEl = document.getElementById('price-chart-label');
  if (labelEl) labelEl.textContent = priceHistory.at(-1).toFixed(2);

  // Hide placeholder once data arrives
  const ph = document.getElementById('price-placeholder');
  if (ph) ph.setAttribute('display', 'none');
}

/* ─── Order Book Update ──────────────────────── */
function updateOrderBook(snapshot) {
  const set = (id, val, fixed) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val != null ? (fixed != null ? val.toFixed(fixed) : val) : '--';
  };
  set('ob-ask',  snapshot.best_ask, 2);
  set('ob-bid',  snapshot.best_bid, 2);
  set('ob-mid',  snapshot.mid,      2);
  set('ob-spread', snapshot.spread, 4);
  set('ob-tick', snapshot.tick_size, null);

  const updEl = document.getElementById('ob-updated');
  if (updEl) updEl.textContent = new Date().toTimeString().slice(0, 8);
}

/* ─── Unified Book Snapshot Poll ─────────────── */
async function pollBookSnapshot() {
  try {
    const snap = await fetch(BASE_URL + '/book/snapshot', { signal: AbortSignal.timeout(4000) })
      .then(r => r.json());
    updatePriceChart(snap);
    updateOrderBook(snap);
  } catch {
    /* silent: service status indicator already reflects state */
  }
}

pollBookSnapshot();
setInterval(pollBookSnapshot, 5000);

/* ─── Regime Gauge Update ─────────────────────── */
function updateRegimeGauge(payload) {
  const score = payload.regime_score ?? payload.score ?? 0;

  const bar = document.getElementById('regime-bar');
  if (bar) {
    const pct = (score * 100).toFixed(1) + '%';
    bar.style.width = pct;
    bar.style.background = score >= 0.6 ? COLOR.up : score >= 0.4 ? COLOR.warn : COLOR.down;
  }

  const label = document.getElementById('regime-score-label');
  if (label) {
    label.textContent = score.toFixed(3);
    label.style.color = score >= 0.6 ? COLOR.up : score >= 0.4 ? COLOR.warn : COLOR.down;
  }

  const s1Active = score >= 0.5;
  const s2Active = score >= 0.6;
  document.getElementById('regime-s1-tag')?.classList.toggle('active', s1Active);
  document.getElementById('regime-s2-tag')?.classList.toggle('active', s2Active);

  // Sub-dimensions (if provided in payload)
  if (payload.sigma_trend  != null) {
    const el = document.getElementById('regime-trend');
    if (el) el.textContent = payload.sigma_trend.toFixed(3);
  }
  if (payload.alternation  != null) {
    const el = document.getElementById('regime-alt');
    if (el) el.textContent = payload.alternation.toFixed(3);
  }
  if (payload.volume_ratio != null) {
    const el = document.getElementById('regime-vol');
    if (el) el.textContent = payload.volume_ratio.toFixed(3);
  }
}

function updateWindowInfo(payload) {
  const el = document.getElementById('window-val');
  if (el && payload.window_id) el.textContent = payload.window_id;
  const regimeWin = document.getElementById('regime-window');
  if (regimeWin && payload.window_id) regimeWin.textContent = payload.window_id;
}

/* ─── WebSocket /events/stream ───────────────── */
let _ws = null;
let _wsRetry = 0;

function connectWS() {
  if (_ws && (_ws.readyState === WebSocket.OPEN || _ws.readyState === WebSocket.CONNECTING)) return;

  const wsDot  = document.getElementById('ws-dot');
  const wsStat = document.getElementById('ws-status');

  try {
    _ws = new WebSocket('ws://localhost:53123/events/stream');
  } catch {
    if (wsStat) wsStat.textContent = 'err';
    return;
  }

  _ws.onopen = () => {
    _wsRetry = 0;
    if (wsDot)  wsDot.style.background  = COLOR.up;
    if (wsStat) { wsStat.textContent = 'ok'; wsStat.style.color = COLOR.up; }
    addLog('WS /events/stream 已连接');
  };

  _ws.onmessage = (ev) => {
    try {
      const event = JSON.parse(ev.data);
      if (event.type === 'connected') {
        addLog('WS 握手完成');
        return;
      }
      if (event.type === 'regime.changed') {
        updateRegimeGauge(event.payload);
        addLog('regime.changed → score=' + (event.payload.regime_score ?? '?').toFixed?.(3));
      }
      if (event.type === 'window.switch') {
        updateWindowInfo(event.payload);
        addLog('window.switch → ' + (event.payload.window_id ?? '?'));
      }
    } catch { /* ignore malformed frames */ }
  };

  _ws.onclose = () => {
    if (wsDot)  wsDot.style.background  = COLOR.down;
    if (wsStat) { wsStat.textContent = 'dc'; wsStat.style.color = COLOR.down; }
    // Exponential back-off: 2s, 4s, 8s, max 30s
    const delay = Math.min(2000 * Math.pow(2, _wsRetry++), 30000);
    setTimeout(connectWS, delay);
  };

  _ws.onerror = () => {
    if (wsDot)  wsDot.style.background  = COLOR.warn;
    if (wsStat) { wsStat.textContent = 'err'; wsStat.style.color = COLOR.warn; }
  };
}

connectWS();
// Attempt reconnect every 30s if still disconnected
setInterval(connectWS, 30000);

/* ─── Win-rate Chart ─────────────────────────── */
async function loadWinRateChart() {
  try {
    const raw = await fetch(BASE_URL + '/stats', { signal: AbortSignal.timeout(4000) }).then(r => r.json());
    const data = Array.isArray(raw) ? raw : (raw.data ?? []);
    renderWinRateChart(data);
  } catch {
    // /stats may not exist — show empty state (no crash)
    renderWinRateChart([]);
  }
}

function renderWinRateChart(data) {
  const ph   = document.getElementById('winrate-placeholder');
  const line = document.getElementById('winrate-line');
  const statusEl = document.getElementById('winrate-status');

  if (!data || data.length < 3) {
    if (ph)   ph.setAttribute('display', '');
    if (line) line.setAttribute('points', '');
    if (statusEl) statusEl.textContent = data.length + ' 条';
    return;
  }

  if (ph) ph.setAttribute('display', 'none');

  const svg = document.getElementById('winrate-svg');
  const vw  = svg.clientWidth  || 600;
  const vh  = 64;

  // Compute win_rate if not present
  const rows = data.map(r => {
    const wins  = r.wins  ?? 0;
    const total = r.total_windows ?? r.total ?? 1;
    return { ...r, win_rate: r.win_rate ?? (total > 0 ? wins / total : 0) };
  });

  const pts = rows.map((r, i) => {
    const x = (i / (rows.length - 1)) * vw;
    const y = vh - (r.win_rate * (vh - 8)) - 4;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  if (line) line.setAttribute('points', pts);
  if (statusEl) statusEl.textContent = rows.length + ' 条';
}

loadWinRateChart();
setInterval(loadWinRateChart, 30000);

/* ─── Navigation Tab Switching ───────────────── */
function switchTab(tabId) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tabId);
  });
}

/* ─── Time-frame Button ──────────────────────── */
function setTf(btn, tf) {
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
