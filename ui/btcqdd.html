<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCQDD</title>
  <link rel="stylesheet" href="css/btcqdd.css">
  <style>
.th-tf-btn {
  background: transparent;
  border: 1px solid #333;
  color: #888;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}
.th-tf-btn.active {
  border-color: var(--color-up, #26a69a);
  color: var(--color-up, #26a69a);
}
.th-tf-btn:hover {
  border-color: #555;
  color: #ccc;
}
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span style="font-weight:800;font-size:14px;margin-right:14px">
      <span style="color:#6366f1">BTC</span><span style="color:#2a2a40">QDD</span>
    </span>
    <div style="width:1px;height:14px;background:#12122a;margin-right:4px"></div>
    <div class="topbar-tab active" data-tab="hall" onclick="switchTab('hall')"><span>📈</span>交易大厅</div>
    <div class="topbar-tab" data-tab="lab"  onclick="switchTab('lab')"><span>🧪</span>策略实验室</div>
    <div class="topbar-tab" data-tab="set"  onclick="switchTab('set')"><span>⚙️</span>通用设置</div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:4px;background:#0e0e22;border-radius:3px;padding:2px 8px">
      <div style="width:5px;height:5px;border-radius:3px;background:#3b82f6"></div>
      <span style="color:#3b82f6;font-size:9px;font-weight:600">模拟</span>
    </div>
    <span style="color:#10b981;font-family:var(--m);font-weight:700;font-size:12px;margin-left:8px">$1,000</span>
    <span style="color:#444;font-size:10px;cursor:pointer;margin-left:12px">登录</span>
  </div>
  <div id="main">
    <div id="page-hall" class="page active"></div>

    <div id="page-set"  class="page"></div>
  </div>
</div>
<script src="js/shared.js"></script>
<script src="js/trading-hall.js"></script>
<script src="js/strategy-lab.js"></script>
<script src="js/settings.js"></script>

<script>
  window.addEventListener('DOMContentLoaded', () => switchTab('hall'));
</script>
</body>
</html>
