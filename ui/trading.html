<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTCQDD — Trading Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --bg2: #12121a; --bg3: #1a1a25;
    --border: #1e1e2e; --border2: #2a2a3a;
    --green: #00ff9d; --amber: #ffb800; --red: #ff4060;
    --text: #e8e8f0; --text2: #8888a0; --text3: #555570;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; }

  /* Offline banner */
  .offline-banner {
    display:none; background:#1a0008; border-bottom:1px solid var(--red);
    padding:8px; text-align:center; color:var(--red); font-size:12px;
    letter-spacing:2px; animation:pulse 1.5s infinite;
  }
  .offline-banner.on { display:block; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  /* Layout */
  .dashboard { padding:12px 16px; max-width:1400px; margin:0 auto; }

  /* LAYER 1: Regime */
  .regime-panel {
    background:var(--bg2); border:1px solid var(--border); border-radius:2px;
    padding:16px 20px; margin-bottom:12px;
  }
  .regime-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .regime-title { font-size:11px; letter-spacing:3px; color:var(--text2); }
  .regime-ts { font-size:11px; color:var(--text3); }
  .regime-status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .regime-status-dot.online { background:var(--green); box-shadow:0 0 6px var(--green); }
  .regime-status-dot.offline { background:var(--red); box-shadow:0 0 6px var(--red); }
  .regime-status-label { font-size:11px; letter-spacing:1px; }

  .regime-body { display:flex; gap:32px; align-items:center; }
  .regime-score-block { min-width:220px; }
  .regime-score-val { font-size:32px; font-weight:700; transition:color .15s; }
  .regime-score-bar { height:8px; background:var(--bg); border:1px solid var(--border2); margin-top:6px; border-radius:1px; }
  .regime-score-fill { height:100%; transition:width .3s, background .3s; border-radius:1px; }
  .regime-label { font-size:13px; letter-spacing:2px; margin-top:6px; font-weight:700; }

  .regime-dims { flex:1; }
  .dim-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .dim-name { width:110px; font-size:11px; color:var(--text2); letter-spacing:1px; }
  .dim-bar { flex:1; height:6px; background:var(--bg); border:1px solid var(--border2); border-radius:1px; }
  .dim-fill { height:100%; background:var(--green); transition:width .3s; border-radius:1px; }
  .dim-val { width:40px; text-align:right; font-size:12px; }

  /* LAYER 2: Instances */
  .instances-row { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:12px; }
  .inst-card {
    background:var(--bg2); border:1px solid var(--border); border-radius:2px;
    padding:16px 18px; min-width:280px; flex:1;
  }
  .inst-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .inst-id { font-size:14px; font-weight:700; letter-spacing:1px; }
  .inst-switch { font-size:11px; letter-spacing:1px; }
  .inst-switch.on { color:var(--green); }
  .inst-switch.off { color:var(--text3); }
  .inst-sep { border:none; border-top:1px solid var(--border); margin-bottom:10px; }
  .inst-row { display:flex; justify-content:space-between; margin-bottom:5px; }
  .inst-label { font-size:11px; color:var(--text2); letter-spacing:1px; }
  .inst-val { font-size:12px; transition:color .15s; }
  .inst-active { color:var(--green); font-weight:700; }
  .inst-sleep { color:var(--text3); }
  .pnl-pos { color:var(--green); } .pnl-neg { color:var(--red); }
  .countdown { font-size:11px; margin-left:6px; transition:color .15s; }
  .countdown.warn { color:var(--amber); }
  .countdown.crit { color:var(--red); animation:pulse 1s infinite; }
  .pair-ok { color:var(--green); } .pair-over { color:var(--red); }

  .reload-btn {
    margin-top:10px; background:none; border:1px solid var(--border2); color:var(--text2);
    padding:5px 14px; font-family:inherit; font-size:11px; cursor:pointer;
    letter-spacing:1px; border-radius:2px; transition:all .2s; width:100%;
  }
  .reload-btn:hover { border-color:var(--green); color:var(--green); }
  .reload-msg { font-size:11px; text-align:center; margin-top:4px; min-height:16px; letter-spacing:1px; }

  /* LAYER 3: Cancel + Orders */
  .bottom-row { display:flex; gap:12px; }
  .bottom-panel {
    background:var(--bg2); border:1px solid var(--border); border-radius:2px;
    padding:16px 18px; flex:1;
  }
  .panel-title { font-size:11px; letter-spacing:3px; color:var(--text2); margin-bottom:12px; }

  .cancel-row { display:flex; justify-content:space-between; margin-bottom:4px; }
  .cancel-label { font-size:12px; color:var(--text2); }
  .cancel-sub { padding-left:12px; color:var(--text3); font-size:11px; }
  .cancel-val { font-size:12px; }

  .latency-row { display:flex; justify-content:space-between; margin-bottom:4px; }
  .latency-label { font-size:12px; color:var(--text2); }
  .latency-val { font-size:12px; }

  .orders-empty { color:var(--text3); font-size:12px; letter-spacing:1px; padding:12px 0; }
  .order-item {
    display:flex; gap:10px; padding:5px 0; border-bottom:1px solid var(--border);
    font-size:11px; align-items:center;
  }
  .order-item:last-child { border-bottom:none; }
  .order-id { color:var(--text2); width:80px; overflow:hidden; text-overflow:ellipsis; }
  .order-side { width:50px; font-weight:700; }
  .order-side.UP { color:var(--green); }
  .order-side.DOWN { color:var(--red); }
  .order-price { width:60px; text-align:right; }
  .order-size { width:60px; text-align:right; color:var(--text2); }
  .order-age { flex:1; text-align:right; color:var(--text3); }
</style>
</head>
<body>

<div class="offline-banner" id="offlineBanner">SERVICE OFFLINE</div>

<div class="dashboard">
  <!-- LAYER 1: Regime Monitor -->
  <div class="regime-panel">
    <div class="regime-header">
      <span class="regime-title">REGIME MONITOR</span>
      <span class="regime-ts" id="regimeTs">—</span>
      <span>
        <span class="regime-status-dot online" id="statusDot"></span>
        <span class="regime-status-label" id="statusLabel">ONLINE</span>
      </span>
    </div>
    <div class="regime-body">
      <div class="regime-score-block">
        <div class="regime-score-val" id="regimeScore">—</div>
        <div class="regime-score-bar"><div class="regime-score-fill" id="regimeBar" style="width:0%"></div></div>
        <div class="regime-label" id="regimeLabel">—</div>
      </div>
      <div class="regime-dims">
        <div class="dim-row">
          <span class="dim-name">SIGMA_TREND</span>
          <div class="dim-bar"><div class="dim-fill" id="dimSigma" style="width:0%"></div></div>
          <span class="dim-val" id="dimSigmaVal">—</span>
        </div>
        <div class="dim-row">
          <span class="dim-name">ALTERNATION</span>
          <div class="dim-bar"><div class="dim-fill" id="dimAlt" style="width:0%"></div></div>
          <span class="dim-val" id="dimAltVal">—</span>
        </div>
        <div class="dim-row">
          <span class="dim-name">VOLUME</span>
          <div class="dim-bar"><div class="dim-fill" id="dimVol" style="width:0%"></div></div>
          <span class="dim-val" id="dimVolVal">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- LAYER 2: Strategy Instances -->
  <div class="instances-row" id="instancesRow">
    <div class="inst-card"><span class="inst-label" style="color:var(--text3)">Loading...</span></div>
  </div>

  <!-- LAYER 3: Cancel Engine + Active Orders -->
  <div class="bottom-row">
    <div class="bottom-panel">
      <div class="panel-title">CANCEL ENGINE</div>
      <div class="cancel-row"><span class="cancel-label">TOTAL</span><span class="cancel-val" id="cTotal">0</span></div>
      <div class="cancel-row"><span class="cancel-label cancel-sub">SIGMA</span><span class="cancel-val" id="cSigma">0</span></div>
      <div class="cancel-row"><span class="cancel-label cancel-sub">TAU</span><span class="cancel-val" id="cTau">0</span></div>
      <div class="cancel-row"><span class="cancel-label cancel-sub">AGE</span><span class="cancel-val" id="cAge">0</span></div>
      <div class="cancel-row"><span class="cancel-label cancel-sub">TICK &Delta;</span><span class="cancel-val" id="cTick">0</span></div>

      <div style="margin-top:14px">
        <div class="panel-title">LATENCY</div>
        <div class="latency-row"><span class="latency-label">P50</span><span class="latency-val" id="lP50">0 ms</span></div>
        <div class="latency-row"><span class="latency-label">P95</span><span class="latency-val" id="lP95">0 ms</span></div>
      </div>
    </div>

    <div class="bottom-panel">
      <div class="panel-title">ACTIVE ORDERS</div>
      <div id="ordersBody"><div class="orders-empty">NO OPEN ORDERS</div></div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:53123';
let online = false;

function setOnline(v) {
  online = v;
  const dot = document.getElementById('statusDot');
  const lbl = document.getElementById('statusLabel');
  const ban = document.getElementById('offlineBanner');
  if (v) {
    dot.className = 'regime-status-dot online';
    lbl.textContent = 'ONLINE'; lbl.style.color = 'var(--green)';
    ban.classList.remove('on');
  } else {
    dot.className = 'regime-status-dot offline';
    lbl.textContent = 'OFFLINE'; lbl.style.color = 'var(--red)';
    ban.classList.add('on');
  }
}

function scoreColor(s) {
  if (s >= 0.6) return 'var(--green)';
  if (s >= 0.4) return 'var(--amber)';
  return 'var(--red)';
}

function scoreLabel(s) {
  if (s >= 0.6) return 'OSCILLATING';
  if (s >= 0.4) return 'TRANSITIONAL';
  return 'TRENDING';
}

// ── Window countdown ──
function getWindowCountdown(windowTimestamp) {
  if (!windowTimestamp) return { text: '\u2014', remaining: Infinity };
  const windowEnd = parseInt(windowTimestamp) + 300;
  const remaining = windowEnd - Math.floor(Date.now() / 1000);
  if (remaining <= 0) return { text: 'SETTLING', remaining: 0 };
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  return { text: m + ':' + String(s).padStart(2, '0'), remaining };
}

// ── Countdown ticker (1s) ──
setInterval(() => {
  document.querySelectorAll('[data-window]').forEach(el => {
    const cd = getWindowCountdown(el.dataset.window);
    el.textContent = '[' + cd.text + ']';
    el.className = cd.remaining <= 15 ? 'countdown crit' : cd.remaining <= 60 ? 'countdown warn' : 'countdown';
  });
}, 1000);

// ── Regime polling (2s) ──
async function pollRegime() {
  try {
    const r = await fetch(API + '/ui/regime');
    const d = await r.json();
    if (!d.ok) throw new Error('not ok');
    setOnline(true);
    const s = d.data.score;
    const col = scoreColor(s);
    document.getElementById('regimeScore').textContent = s.toFixed(3);
    document.getElementById('regimeScore').style.color = col;
    document.getElementById('regimeBar').style.width = (s * 100) + '%';
    document.getElementById('regimeBar').style.background = col;
    document.getElementById('regimeLabel').textContent = scoreLabel(s);
    document.getElementById('regimeLabel').style.color = col;

    const dim = d.data.dimensions;
    document.getElementById('dimSigma').style.width = (dim.sigma_trend * 100) + '%';
    document.getElementById('dimSigmaVal').textContent = dim.sigma_trend.toFixed(2);
    document.getElementById('dimAlt').style.width = (dim.alternation * 100) + '%';
    document.getElementById('dimAltVal').textContent = dim.alternation.toFixed(2);
    document.getElementById('dimVol').style.width = (dim.volume * 100) + '%';
    document.getElementById('dimVolVal').textContent = dim.volume.toFixed(2);

    if (d.data.updated_at) {
      document.getElementById('regimeTs').textContent = d.data.updated_at.replace('T', ' ').slice(0, 19);
    }
  } catch (_) { setOnline(false); }
}

// ── Instances polling (2s) ──
async function pollInstances() {
  try {
    const r = await fetch(API + '/ui/instances');
    const d = await r.json();
    if (!d.ok) throw new Error('not ok');
    const container = document.getElementById('instancesRow');
    container.innerHTML = d.data.map(inst => {
      const swCls = inst.enabled ? 'inst-switch on' : 'inst-switch off';
      const swTxt = inst.enabled ? '\u25CF ON' : '\u25CB OFF';
      const actCls = inst.is_active ? 'inst-active' : 'inst-sleep';
      const actTxt = inst.is_active ? '\u25B6 ACTIVE' : '\u25FC SLEEP';
      let pnlTxt = '\u2014', pnlCls = '';
      if (inst.paper_pnl !== null && inst.paper_pnl !== undefined) {
        pnlTxt = (inst.paper_pnl >= 0 ? '+' : '') + inst.paper_pnl.toFixed(2);
        pnlCls = inst.paper_pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
      }
      const cd = getWindowCountdown(inst.current_window);
      const cdCls = cd.remaining <= 15 ? 'countdown crit' : cd.remaining <= 60 ? 'countdown warn' : 'countdown';
      let pairTxt = '\u2014', pairCls = '';
      if (inst.pair_cost !== null && inst.pair_cost !== undefined) {
        pairTxt = '$' + inst.pair_cost.toFixed(4);
        pairCls = inst.pair_cost < 1.0 ? 'pair-ok' : 'pair-over';
      }
      const volTxt = inst.volume_score !== null && inst.volume_score !== undefined ? inst.volume_score.toFixed(2) : '\u2014';
      return `<div class="inst-card">
        <div class="inst-header">
          <span class="inst-id">${inst.strategy_id}</span>
          <span class="${swCls}">${swTxt}</span>
        </div>
        <hr class="inst-sep">
        <div class="inst-row"><span class="inst-label">REGIME</span><span class="inst-val">${(inst.regime_score ?? 0).toFixed(3)} <span class="${actCls}">${actTxt}</span></span></div>
        <div class="inst-row"><span class="inst-label">WINDOW</span><span class="inst-val">${inst.current_window || '\u2014'} <span class="${cdCls}" data-window="${inst.current_window || ''}">[${cd.text}]</span></span></div>
        <div class="inst-row"><span class="inst-label">PnL</span><span class="inst-val ${pnlCls}">${pnlTxt}</span></div>
        <div class="inst-row"><span class="inst-label">ORDERS</span><span class="inst-val">${inst.open_orders} open</span></div>
        <div class="inst-row"><span class="inst-label">PAIR COST</span><span class="inst-val ${pairCls}">${pairTxt}</span></div>
        <div class="inst-row"><span class="inst-label">VOL SCORE</span><span class="inst-val">${volTxt}</span></div>
        <button class="reload-btn" onclick="reloadConfig(this)">&#x21BA; RELOAD CONFIG</button>
        <div class="reload-msg" id="reload-msg-${inst.strategy_id}"></div>
      </div>`;
    }).join('');
  } catch (_) {}
}

// ── Cancel-stats polling (5s) ──
async function pollCancelStats() {
  try {
    const r = await fetch(API + '/ui/cancel-stats');
    const d = await r.json();
    if (!d.ok) throw new Error('not ok');
    const s = d.data;
    document.getElementById('cTotal').textContent = s.total;
    document.getElementById('cSigma').textContent = s.by_reason.sigma;
    document.getElementById('cTau').textContent = s.by_reason.tau;
    document.getElementById('cAge').textContent = s.by_reason.age;
    document.getElementById('cTick').textContent = s.by_reason.tick_size_change;
    document.getElementById('lP50').textContent = s.latency_ms.p50 + ' ms';
    document.getElementById('lP95').textContent = s.latency_ms.p95 + ' ms';
  } catch (_) {}
}

// ── Active-orders polling (2s) ──
async function pollActiveOrders() {
  try {
    const r = await fetch(API + '/ui/active-orders');
    const d = await r.json();
    if (!d.ok) throw new Error('not ok');
    const body = document.getElementById('ordersBody');
    if (!d.data.length) {
      body.innerHTML = '<div class="orders-empty">NO OPEN ORDERS</div>';
      return;
    }
    body.innerHTML = d.data.map(o => {
      const ageSec = (o.age_ms / 1000).toFixed(1);
      return `<div class="order-item">
        <span class="order-id">${o.order_id.slice(0, 8)}</span>
        <span class="order-side ${o.side}">${o.side}</span>
        <span class="order-price">${o.price.toFixed(4)}</span>
        <span class="order-size">${o.size.toFixed(2)}</span>
        <span class="order-age">${ageSec}s</span>
      </div>`;
    }).join('');
  } catch (_) {}
}

// ── Reload config ──
async function reloadConfig(btn) {
  const card = btn.closest('.inst-card');
  const msgEl = card.querySelector('.reload-msg');
  try {
    const r = await fetch(API + '/config/reload', { method: 'POST' });
    const d = await r.json();
    if (d.status === 'reloaded') {
      msgEl.textContent = 'CONFIG RELOADED';
      msgEl.style.color = 'var(--green)';
    } else {
      throw new Error(d.message || 'unknown');
    }
  } catch (e) {
    msgEl.textContent = 'RELOAD FAILED';
    msgEl.style.color = 'var(--red)';
  }
  setTimeout(() => { msgEl.textContent = ''; }, 2000);
}

// ── Init polling ──
pollRegime();
pollInstances();
pollCancelStats();
pollActiveOrders();

setInterval(pollRegime, 2000);
setInterval(pollInstances, 2000);
setInterval(pollActiveOrders, 2000);
setInterval(pollCancelStats, 5000);
</script>
</body>
</html>
