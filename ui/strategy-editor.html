<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCQDD 策略编辑器</title>
  <link rel="stylesheet" href="css/btcqdd.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0b0b19;
      color: #ccc;
      overflow: hidden;
    }
    /* Task 260314_008: Layout Adjustment (1:3 ratio) */
    .se-left {
      flex: 1 !important;
      max-width: 25% !important;
      min-width: 25% !important;
    }
    .se-right {
      flex: 3 !important;
      width: auto !important; /* Override fixed width 360px */
      max-width: 75% !important;
      min-width: 75% !important;
    }
    .se-stats-panel {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 24px;
      padding: 4px 16px;
      padding-right: 16px; /* Fix: Stats overflow */
      flex-shrink: 0;
      border-bottom: 1px solid #333;
    }
    .se-stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }
    .se-stat-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 2px;
    }
    .se-stat-value {
      font-size: 14px;
      font-family: monospace;
      color: #fff;
    }
    .se-restart-btn { font-size: 12px; padding: 3px 10px; background: #2a2a2a; color: #aaa; border: 1px solid #444; border-radius: 4px; cursor: pointer; margin-right: 8px; }
    .se-restart-btn:hover { background: #3a3a3a; color: #fff; }
    .se-right { display: flex; flex-direction: row; flex: 1; overflow: hidden; }
    .se-left-panels { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .se-order-panel { width: 220px; border-left: 1px solid #222; display: flex; flex-direction: column; padding: 8px; font-size: 12px; overflow-y: auto; }
    .se-order-title { font-weight: bold; color: #aaa; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    .se-order-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .se-order-table th { color: #666; font-weight: normal; padding: 2px 4px; border-bottom: 1px solid #222; }
    .se-order-table td { padding: 3px 4px; border-bottom: 1px solid #1a1a1a; }
    .up-color { color: #26a69a; }
    .down-color { color: #ef5350; }
    .pending-color { color: #888; }
    /* Fix: Dark Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #666; }
    /* Fix: Button Wrap */
    .se-btn-deploy { white-space: nowrap; min-width: fit-content; }
    /* Fix: Log Overflow */
    #se-log-area { padding-bottom: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <!-- 容器：由 strategy-editor.js 填充 -->
  <div id="se-container" style="height:100%"></div>

  <script src="js/strategy-editor.js"></script>
  <script>
    // 独立页面模式：手动初始化
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof initStrategyEditor === 'function') {
        initStrategyEditor();
      } else {
        console.error('initStrategyEditor not found');
      }
    });
  </script>
</body>
</html>
